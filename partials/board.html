  <!-- TOWN BULLETIN BOARD: pixel stickers, two photo stickers and a mini music player of Lyanna's
       hobbies and interests, with almost no words (no links, just for fun). Each note can be
       picked up and re-pinned (js/board.js, css/board.css). Inserted into index.html by
       tools/convert_export.py; positions are % of the board, --x/--y wide and --mx/--my narrow. -->
  <div class="bb-wrap">
    <section id="board" data-area="board" class="bb-sec" aria-labelledby="bb-title">
      <div class="rv bb-head">
        <h2 id="bb-title"><span aria-hidden="true"><img class="px" src="assets/images/icon-sprout.svg" width="40" height="40" alt=""></span>Town bulletin board</h2>
        <p>A few of my favorite things. Pick something up and stick it anywhere!</p>
      </div>

      <div class="rv bb-frame">
        <p id="bb-help" class="bb-sr">Each sticker can be moved: drag it, or focus it and use the arrow keys.</p>
        <div class="bb-board" aria-describedby="bb-help">

          <article class="bb-note bb-pic round" tabindex="0" aria-roledescription="movable sticker" aria-label="Photo: hiking with friends at a mountain lake" style="--x:3%;--y:5%;--r:-4deg;--mx:3%;--my:1%"><img src="assets/images/lyanna-and-friends-on-the-granite.jpg" alt="" loading="lazy" style="object-position:50% 40%"></article>
          <article class="bb-note bb-player" tabindex="0" aria-roledescription="movable sticker" aria-label="Now playing: Tweak by GIRLSET" style="--x:22%;--y:6%;--r:2deg;--mx:40%;--my:3%">
            <span class="bb-cover" aria-hidden="true"></span>
            <span class="bb-track"><b>Tweak</b><small>GIRLSET</small><span class="bb-ctrl" aria-hidden="true">◂◂ &#10073;&#10073; ▸▸</span></span>
          </article>
          <article class="bb-note bb-pic round sm" tabindex="0" aria-roledescription="movable sticker" aria-label="Photo: Swiss Alps" style="--x:62%;--y:4%;--r:5deg;--mx:62%;--my:19%"><img src="assets/images/lyanna-looking-out-at-snowy-swiss.jpg" alt="" loading="lazy" style="object-position:50% 30%"></article>
          <article class="bb-note bb-stk xl" tabindex="0" aria-roledescription="movable sticker" aria-label="Sticker: ribbon fox" style="--x:30%;--y:42%;--r:-6deg;--mx:34%;--my:40%"><img src="assets/images/sticker-fox.svg" alt=""></article>

            <span class="bb-photo bb-scene" aria-hidden="true"><img class="px" src="assets/images/lyannas-chibi-happily-holding-a-fishing.png" alt=""></span>
            <b>gone fishin'</b>
          </article>
          <article class="bb-note bb-stk" tabindex="0" aria-roledescription="movable sticker" aria-label="Sticker: microphone, for singing" style="--x:52%;--y:9%;--r:8deg;--mx:6%;--my:20%"><img src="assets/images/sticker-mic.svg" alt=""></article>
